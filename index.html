<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head><body>
<title>Gaurav Jain Month 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap">
<style>
/* Layout: one full-viewport slide at a time, alternating navy and paper grounds; presenter bar on top, progress + timer below. Single committed look. */
:root{
  --navy:#071426; --blue:#12304B; --blue-2:#1B3D5E; --paper:#F7F8FA; --paper-2:#ECEFF3;
  --gold:#C9A36B; --gold-d:#9C7A45; --grey:#AAB6C3; --ink:#0B1A2E; --ink-2:#4A5A6E;
  --ok:#3E9B74; --rev:#D08A3A; --hold:#7E8FC4; --pend:#8C99A8; --conf-bg:#FFF1DC; --conf-fg:#8A4B0B;
  --f-head:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-serif:"Newsreader",Georgia,"Times New Roman",serif;
  --bar:52px; --foot:46px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--navy);color:var(--paper);font-family:var(--f-body);font-size:16px;line-height:1.55;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--navy)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
.eyebrow{font-family:var(--f-head);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.serif{font-family:var(--f-serif)}
.topbar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:var(--bar);z-index:40;display:flex;align-items:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:rgba(7,20,38,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(170,182,195,.14)}
.brandmark{font-family:var(--f-head);font-weight:800;font-size:13px;letter-spacing:.08em;white-space:nowrap}
.brandmark span{color:var(--gold)}
.crumb{color:var(--grey);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.tb-btn{height:34px;padding:0 12px;border-radius:8px;border:1px solid rgba(170,182,195,.25);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tb-btn:hover{border-color:var(--gold);color:var(--gold)}
.tb-btn svg{width:16px;height:16px}
.stage{position:fixed;top:calc(env(safe-area-inset-top,0px) + var(--bar));bottom:calc(env(safe-area-inset-bottom,0px) + var(--foot));left:0;right:0}
.slide{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.slide.dark{background:var(--navy);color:var(--paper)}
.slide.light{background:var(--paper);color:var(--ink);color-scheme:light}
.slide.light .eyebrow{color:var(--gold-d)}
.slide.enter{animation:enter .55s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.wrap{max-width:1180px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:28px;
  padding-block:clamp(28px,5vh,64px);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.h-xl{font-size:clamp(36px,5.6vw,76px);font-weight:800;line-height:1.02}
.h-l{font-size:clamp(28px,3.8vw,50px);font-weight:800;line-height:1.08}
.lede{font-size:clamp(17px,1.6vw,21px);line-height:1.5;max-width:62ch;color:var(--grey)}
.light .lede{color:var(--ink-2)}
.muted{color:var(--grey)} .light .muted{color:var(--ink-2)}
.rule{height:1px;background:rgba(170,182,195,.2);border:0;margin:0}
.foot{position:fixed;bottom:0;left:0;right:0;height:calc(var(--foot) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);z-index:40;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:14px;background:rgba(7,20,38,.94);border-top:1px solid rgba(170,182,195,.14)}
.progress{flex:1;display:flex;gap:4px;min-width:0}
.progress button{flex:1;height:18px;position:relative}
.progress button::after{content:"";position:absolute;left:0;right:0;top:8px;height:3px;border-radius:2px;background:rgba(170,182,195,.25)}
.progress button.done::after{background:rgba(201,163,107,.55)}
.progress button.on::after{background:var(--gold)}
.navbtn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(170,182,195,.3);display:grid;place-items:center;flex:none}
.navbtn:hover{border-color:var(--gold);color:var(--gold)}
.navbtn svg{width:16px;height:16px}
.count{font-size:12px;color:var(--grey);font-variant-numeric:tabular-nums;white-space:nowrap}
.timer{font-size:12px;color:var(--grey);font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:center;gap:8px}
.timer b{font-weight:600;color:var(--paper)}
.timer.late b{color:var(--rev)}
.timer button{font-size:11px;text-decoration:underline;color:var(--grey)}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(24px,5vw,72px);align-items:center}
.hero .h-xl{letter-spacing:-.035em}
.hero .sub{font-family:var(--f-serif);font-style:italic;font-size:clamp(22px,2.4vw,32px);color:var(--gold);margin-top:10px}
.hero .meta{display:flex;flex-direction:column;gap:6px;margin-top:28px;font-size:15px;color:var(--grey)}
.portrait{aspect-ratio:4/5;max-width:100%;border:1px solid rgba(201,163,107,.45);border-radius:4px;position:relative;overflow:hidden;background:var(--blue)}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 24px;border-radius:999px;font-family:var(--f-head);font-weight:700;font-size:15px;letter-spacing:.02em}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover{background:#d8b47e}
.btn-ghost{border:1px solid currentColor}
.btn-sm{height:38px;padding:0 16px;font-size:13px}
.btn svg{width:18px;height:18px}
.btn-ink{background:var(--navy);color:var(--paper)}
.btn-outline{border:1px solid rgba(11,26,46,.3);color:var(--ink)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(170,182,195,.18);border:1px solid rgba(170,182,195,.18)}
.trio > div{background:var(--navy);padding:26px 24px;display:flex;flex-direction:column;gap:10px;min-width:0}
.trio .n{font-family:var(--f-serif);font-size:40px;color:var(--gold);line-height:1}
.trio h3{font-size:19px}
.summary{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:start}
.summary ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:12px 32px}
.summary li{padding-left:16px;position:relative;font-size:15px;color:var(--grey)}
.summary li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:1px;background:var(--gold)}
.traits{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.trait{text-align:left;border:1px solid rgba(11,26,46,.14);border-radius:6px;padding:18px 16px;background:#fff;display:flex;flex-direction:column;gap:12px;min-height:170px;color:var(--ink)}
.trait:hover{border-color:var(--gold-d)}
.trait.on{border-color:var(--navy);background:var(--navy);color:var(--paper)}
.trait .k{font-family:var(--f-head);font-size:12px;font-weight:700;color:var(--gold-d);letter-spacing:.1em}
.trait.on .k{color:var(--gold)}
.trait h3{font-size:17px;line-height:1.3;font-weight:700}
.trait .more{margin-top:auto;font-size:12px;color:var(--ink-2)}
.trait.on .more{color:var(--grey)}
.evidence{border-left:2px solid var(--gold);padding:6px 0 6px 22px;display:grid;grid-template-columns:1fr 1fr;gap:28px;min-height:150px}
.evidence .quote{font-family:var(--f-serif);font-size:clamp(20px,2vw,26px);line-height:1.35;font-style:italic;color:var(--ink)}
.evidence .story{font-size:15.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:10px}
.evidence .src{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-d);font-weight:600}
.aud{display:grid;grid-template-columns:320px 1fr;gap:28px;align-items:start}
.aud-list{display:flex;flex-direction:column;gap:8px}
.aud-btn{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:center;text-align:left;padding:14px 16px;border-radius:6px;border:1px solid rgba(170,182,195,.2)}
.aud-btn .p{font-family:var(--f-serif);font-size:28px;color:var(--grey);line-height:1}
.aud-btn .t{font-family:var(--f-head);font-weight:700;font-size:15px;line-height:1.25}
.aud-btn .s{font-size:12px;color:var(--grey)}
.aud-btn.on{background:var(--blue);border-color:var(--gold)}
.aud-btn.on .p{color:var(--gold)}
.aud-panel{background:var(--blue);border-radius:6px;padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:24px 32px;min-width:0}
.aud-panel h3{grid-column:1/-1;font-size:24px}
.q span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;font-family:var(--f-head);margin-bottom:6px}
.q p{font-size:15.5px;color:#DCE3EB}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid rgba(170,182,195,.3);color:var(--grey)}
.rep{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(11,26,46,.15)}
.rep > div{padding:28px 22px 8px;display:flex;flex-direction:column;gap:14px;border-right:1px solid rgba(11,26,46,.1);min-width:0}
.rep > div:first-child{padding-left:0}
.rep > div:last-child{border-right:0}
.rep .big{font-family:var(--f-head);font-weight:800;font-size:clamp(24px,2.5vw,34px);line-height:1.02;letter-spacing:-.03em}
.rep .big em{font-style:normal;color:var(--gold-d)}
.rep p{font-family:var(--f-serif);font-size:19px;line-height:1.4;color:var(--ink)}
.rep small{font-size:13px;color:var(--ink-2)}
.pull{font-family:var(--f-serif);font-size:clamp(22px,2.6vw,34px);line-height:1.3;max-width:36ch}
.pull em{color:var(--gold-d)}
.dark .pull em{color:var(--gold)}
.li-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:24px;align-items:start}
.li{background:#fff;color:#1d2226;border-radius:10px;overflow:hidden;border:1px solid rgba(11,26,46,.12);min-width:0}
.li-banner{height:120px;background:var(--navy);position:relative;display:flex;align-items:center;justify-content:flex-end;padding:0 28px}
.li-banner::before{content:"";position:absolute;left:0;top:0;bottom:0;width:38%;background:linear-gradient(90deg,var(--blue),transparent)}
.li-banner .bt{font-family:var(--f-head);font-weight:700;color:var(--paper);font-size:clamp(14px,1.6vw,19px);text-align:right;line-height:1.3;position:relative}
.li-banner .bt span{color:var(--gold);font-size:.72em;font-weight:600}
.li-body{padding:0 24px 22px}
.li-av{width:104px;height:104px;border-radius:50%;border:4px solid #fff;background:var(--blue);margin-top:-52px;overflow:hidden;position:relative}
.li-av img{width:100%;height:100%;object-fit:cover}
.li-name{font-size:22px;font-weight:600;margin-top:10px}
.li-head{font-size:15px;line-height:1.45;margin-top:4px}
.li-loc{font-size:13px;color:#666;margin-top:6px}
.li-sec{border-top:1px solid #e7e7e7;padding:16px 24px}
.li-sec h4{font-family:var(--f-body);font-size:16px;font-weight:600;margin-bottom:8px}
.li-about{font-size:14px;line-height:1.55;white-space:pre-line}
.li-about.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.side-card{border:1px solid rgba(11,26,46,.12);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px;background:#fff}
.side-card h4{font-size:15px}
.side-card ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.ctrl-row{display:flex;gap:10px;flex-wrap:wrap}
.alt-list{display:flex;flex-direction:column;gap:10px}
.alt{border:1px solid rgba(11,26,46,.14);border-radius:8px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:4px;background:#fff;color:var(--ink)}
.alt.on{border-color:var(--gold-d);box-shadow:inset 3px 0 0 var(--gold)}
.alt .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-d);font-weight:700}
.alt .v{font-size:14.5px;line-height:1.45}
.stamp{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:rgba(11,26,46,.06)}
.pillars{display:grid;grid-template-columns:42fr 25fr 17fr 17fr;gap:8px;min-height:230px}
.pillar{text-align:left;border-radius:6px;padding:20px 18px;display:flex;flex-direction:column;gap:10px;background:var(--blue);border:1px solid transparent;min-width:0}
.pillar:hover{border-color:rgba(201,163,107,.5)}
.pillar.on{border-color:var(--gold);background:var(--blue-2)}
.pillar .pc{font-family:var(--f-serif);font-size:clamp(34px,4vw,56px);line-height:1;color:var(--gold)}
.pillar h3{font-size:clamp(13px,1.15vw,16px);letter-spacing:.04em;text-transform:uppercase;line-height:1.25}
.pillar p{font-size:13.5px;color:var(--grey)}
.pillar .cnt{margin-top:auto;font-size:12px;color:var(--grey)}
.pdetail{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;border-top:1px solid rgba(170,182,195,.2);padding-top:22px}
.arc{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative}
.arc .st{padding:22px 20px 18px;border-top:3px solid var(--navy);display:flex;flex-direction:column;gap:10px;position:relative}
.arc .st:nth-child(1){border-color:var(--gold)}
.arc .st .n{font-family:var(--f-head);font-weight:800;font-size:13px;color:var(--gold-d);letter-spacing:.08em}
.arc .st h3{font-size:22px}
.arc .st p{font-size:14.5px;color:var(--ink-2)}
.arc .st .posts{font-size:12.5px;color:var(--ink);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.week{display:flex;flex-direction:column;gap:10px;min-width:0}
.week-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(170,182,195,.2);padding-bottom:8px}
.week-h b{font-family:var(--f-head);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.week-h span{font-size:12px;color:var(--grey)}
.pcard{text-align:left;background:var(--blue);border-radius:6px;overflow:hidden;display:grid;grid-template-columns:72px 1fr;border:1px solid transparent}
.pcard:hover{border-color:var(--gold)}
.pcard img,.pcard .np{width:72px;height:100%;min-height:96px;object-fit:cover;display:block;background:var(--blue-2)}
.pcard .np{display:grid;place-items:center;font-size:10px;color:var(--grey);text-align:center}
.pcard .bd{padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pcard .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.pcard .num{font-family:var(--f-serif);font-size:20px;color:var(--gold);line-height:1}
.pcard h4{font-family:var(--f-head);font-size:13.5px;line-height:1.3;font-weight:700}
.pcard .tk{font-size:11.5px;color:var(--grey)}
.ptag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.ptag.K{background:rgba(201,163,107,.2);color:var(--gold)}
.ptag.I{background:rgba(62,155,116,.2);color:#8CD3B2}
.ptag.L{background:rgba(126,143,196,.22);color:#B3C0EA}
.ptag.E{background:rgba(208,138,58,.2);color:#F0B77A}
.light .ptag.K{color:#7A5A28} .light .ptag.I{color:#22694C} .light .ptag.L{color:#3E4E86} .light .ptag.E{color:#8A4B0B}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.st-approved{background:var(--ok)} .st-revision{background:var(--rev)} .st-hold{background:var(--hold)} .st-pending{background:var(--pend)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--grey)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cmp > div{border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.cmp .gen{background:var(--paper-2);color:var(--ink-2)}
.cmp .real{background:#fff;border:1px solid rgba(11,26,46,.14);color:var(--ink)}
.cmp .txt{font-size:16px;line-height:1.6}
.cmp .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;font-family:var(--f-head)}
.cmp .real .lbl{color:var(--gold-d)}
.cmp .note{font-size:13px;border-top:1px solid rgba(11,26,46,.1);padding-top:12px}
.lines{display:flex;flex-wrap:wrap;gap:8px}
.lines span{font-family:var(--f-serif);font-style:italic;font-size:16px;background:#fff;border:1px solid rgba(11,26,46,.12);border-radius:999px;padding:6px 14px;color:var(--ink)}
.studio-wrap{height:100%;display:flex;flex-direction:column;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:12px;max-width:1500px;margin:0 auto}
.studio-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.studio-head h2{font-size:clamp(19px,1.9vw,25px)}
.tally{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.tally span{display:inline-flex;align-items:center;gap:6px}
.studio{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr) 330px;gap:14px}
.s-col{min-height:0;overflow-y:auto;border-radius:8px}
.s-list{background:#fff;border:1px solid rgba(11,26,46,.1);padding:6px}
.s-item{width:100%;text-align:left;display:grid;grid-template-columns:40px 1fr 10px;gap:8px;align-items:center;padding:7px 8px;border-radius:6px;color:var(--ink)}
.s-item:hover{background:var(--paper)}
.s-item.on{background:var(--navy);color:var(--paper)}
.s-item img,.s-item .np{width:40px;height:40px;border-radius:5px;object-fit:cover;display:block;background:var(--paper-2)}
.s-item .np{display:grid;place-items:center;font-size:9px;color:var(--ink-2)}
.s-item .t{font-size:13px;font-weight:600;line-height:1.25}
.s-item .w{font-size:11px;color:var(--ink-2);font-weight:400;display:block;margin-top:2px}
.s-item.on .w{color:var(--grey)}
.s-main{background:var(--paper-2);padding:18px}
.post{background:#fff;color:#1d2226;border-radius:10px;border:1px solid rgba(11,26,46,.1);max-width:620px;margin:0 auto;overflow:hidden}
.post-h{display:flex;gap:12px;padding:16px 18px 10px;align-items:center}
.post-h img{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none}
.post-h .nm{font-weight:600;font-size:15px}
.post-h .hl{font-size:12px;color:#666;line-height:1.35}
.pend-flag{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:rgba(140,153,168,.15);color:#56626F;white-space:nowrap}
.post-body{padding:4px 18px 12px;font-size:15.5px;line-height:1.62}
.post-body p{margin:0 0 .85em}
.post-body.clamp{max-height:17em;overflow:hidden;position:relative}
.post-body.clamp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3em;background:linear-gradient(transparent,#fff)}
.hookline{font-size:16.5px;font-weight:600;line-height:1.5;padding:4px 18px 10px;position:relative}
.hookline .hl-tag{display:inline-block;font-family:var(--f-head);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9C7A45;background:#F6EEDF;border-radius:4px;padding:2px 7px;margin-bottom:6px}
.brief{max-width:620px;margin:0 auto 14px;background:#fff;border:1px solid rgba(11,26,46,.1);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;color:var(--ink)}
.brief-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.brief-grid div span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold-d);font-family:var(--f-head);margin-bottom:2px}
.brief-grid div b{font-size:13.5px;font-weight:600;line-height:1.3;display:block}
.brief .idea span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold-d);font-family:var(--f-head);margin-bottom:2px}
.brief .idea p{font-size:14.5px;line-height:1.5}
.brief-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.brief-grid .ptag{white-space:normal;display:inline-block;line-height:1.35}
@media (max-width:640px){.brief-grid{grid-template-columns:1fr 1fr}.brief-row{grid-template-columns:1fr}}
.vtabs{max-width:620px;margin:0 auto 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vtab{border:1px solid rgba(11,26,46,.15);border-radius:8px;padding:10px 12px;text-align:left;background:#fff;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.vtab b{font-family:var(--f-head);font-size:13.5px}
.vtab small{font-size:12px;color:var(--ink-2)}
.vtab.on{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);background:#F3F6FA}
.vtab .rec{color:var(--gold-d);font-weight:700}
.conf{background:var(--conf-bg);color:var(--conf-fg);border-radius:4px;padding:1px 6px;font-weight:600;font-size:.92em;white-space:normal}
.post-x{display:flex;gap:16px;padding:0 18px 12px;font-size:13px}
.post-x button{color:#0a66c2;font-weight:600}
.post-img{display:block;width:100%;max-width:100%;background:#F0F2F5}
.post-noimg{margin:0 18px 18px;padding:28px;border:1px dashed #b8c2cc;border-radius:6px;text-align:center;font-size:13px;color:#56626F;background:#F4F6F8}
.s-meta{background:#fff;border:1px solid rgba(11,26,46,.1);padding:16px;display:flex;flex-direction:column;gap:14px;color:var(--ink)}
.m-sec span.k{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold-d);font-family:var(--f-head);margin-bottom:4px}
.m-sec p{font-size:13.5px;line-height:1.5}
.m-sec ol,.m-sec ul{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.confirm-box{background:var(--conf-bg);border-left:3px solid var(--rev);padding:10px 12px;border-radius:0 6px 6px 0}
.confirm-box span.k{color:var(--conf-fg)}
.st-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.st-btn{height:36px;border-radius:6px;border:1px solid rgba(11,26,46,.18);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);background:#fff}
.st-btn:hover{border-color:var(--ink)}
.st-btn.on.approved{background:var(--ok);border-color:var(--ok);color:#fff}
.st-btn.on.revision{background:var(--rev);border-color:var(--rev);color:#fff}
.st-btn.on.hold{background:var(--hold);border-color:var(--hold);color:#fff}
.st-btn.on.pending{background:var(--pend);border-color:var(--pend);color:#fff}
textarea{width:100%;min-height:84px;resize:vertical;border:1px solid rgba(11,26,46,.2);border-radius:6px;padding:10px;font:inherit;font-size:14px;color:var(--ink);background:#fff}
.saved{font-size:11.5px;color:var(--ink-2);min-height:1em}
.s-nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.overlay{position:fixed;inset:0;z-index:80;background:rgba(7,20,38,.96);overflow-y:auto;padding-block:calc(env(safe-area-inset-top,0px) + 24px) calc(env(safe-area-inset-bottom,0px) + 40px);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.reader{max-width:700px;margin:0 auto;background:var(--paper);color:var(--ink);border-radius:10px;padding:clamp(24px,5vw,56px);color-scheme:light}
.reader .rh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:22px}
.reader h3{font-size:clamp(22px,2.6vw,30px)}
.reader .rbody{font-size:clamp(17px,1.5vw,20px);line-height:1.7}
.reader .rbody p{margin:0 0 1em}
.reader img{width:100%;border-radius:6px;margin:6px 0 18px}
.closex{width:40px;height:40px;border-radius:50%;border:1px solid rgba(11,26,46,.2);display:grid;place-items:center;flex:none;color:var(--ink)}
.closex svg{width:18px;height:18px}
.modal{max-width:760px;margin:0 auto;background:var(--paper);color:var(--ink);border-radius:10px;padding:clamp(20px,4vw,40px);display:flex;flex-direction:column;gap:16px;color-scheme:light}
.modal textarea{min-height:320px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5}
.appr{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:start}
.cat{display:grid;grid-template-columns:28px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(170,182,195,.18)}
.cat .n{font-family:var(--f-serif);font-size:22px;color:var(--gold)}
.cat h4{font-size:16px}
.cat small{display:block;font-size:12.5px;color:var(--grey);margin-top:2px}
.seg{display:flex;border:1px solid rgba(170,182,195,.3);border-radius:8px;overflow:hidden}
.seg button{padding:7px 10px;font-size:12px;font-weight:600;color:var(--grey);border-right:1px solid rgba(170,182,195,.2);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on.approved{background:var(--ok);color:#fff}
.seg button.on.revision{background:var(--rev);color:#fff}
.seg button.on.hold{background:var(--hold);color:#fff}
.seg button.on.pending{background:var(--pend);color:#fff}
.steps{display:flex;flex-direction:column;gap:2px}
.step{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;padding:10px 0;font-size:14.5px;border-bottom:1px solid rgba(170,182,195,.14);cursor:pointer}
.step input{width:18px;height:18px;accent-color:var(--gold);margin:2px 0 0}
.step.done span{color:var(--grey);text-decoration:line-through}
.closing{font-family:var(--f-serif);font-size:clamp(24px,2.8vw,38px);line-height:1.25}
.closing em{color:var(--gold);font-style:italic}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + var(--foot) + 16px);transform:translateX(-50%);background:var(--gold);color:var(--navy);font-weight:600;font-size:13.5px;padding:10px 18px;border-radius:999px;z-index:90}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:1100px){
  .studio{grid-template-columns:200px minmax(0,1fr)} .s-meta{grid-column:1/-1}
  .traits{grid-template-columns:repeat(3,1fr)} .cal{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:820px){
  body{overflow:auto}
  .hero,.aud,.li-grid,.appr,.summary,.cmp,.evidence{grid-template-columns:1fr}
  .hero .portrait{max-width:320px}
  .trio,.rep,.pdetail,.arc{grid-template-columns:1fr 1fr}
  .rep > div{padding-left:0;border-right:0;border-bottom:1px solid rgba(11,26,46,.1);padding-bottom:18px}
  .summary ul{grid-template-columns:1fr}
  .pillars{grid-template-columns:1fr 1fr}
  .aud-panel{grid-template-columns:1fr}
  .studio-wrap{height:auto} .studio{grid-template-columns:1fr} .s-col{overflow:visible}
  .s-list{display:flex;overflow-x:auto;gap:4px} .s-item{min-width:190px}
  .crumb,.count{display:none}
}
@media (max-width:520px){
  .trio,.rep,.pdetail,.traits,.cal,.arc{grid-template-columns:1fr}
  .timer .lbl{display:none} .tb-btn .tx{display:none}
  .cat{grid-template-columns:24px 1fr} .cat .seg{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

const POSTS=[
{n:1,feel:"He's real. He started where many of us start, and kept going.",date:"Live on LinkedIn",hook:"\"Kya karta hai?\"\n\"Kuch nahi karta. Business dhoond raha hoon.\"",slot:"Live",week:0,p:"K",title:"How it began",photo:"5160",aud:"All audiences · CXOs and young founders first",
 purpose:"Introduce the person before any business lesson: an ordinary start, a decision to come back, two failures, a chance he acted on.",
 take:"Big journeys often start small. Anybody can grow if they keep learning.",
 hooks:["\"Kya karta hai?\" / \"Kuch nahi karta. Business dhoond raha hoon.\"","My first visit to Nehru Place was to deliver a Diwali gift.","Before Geonix, I had already tried two businesses that did not work."],
 src:"Your story from the 26 Oct conversation: Rohini, CA entrance, Canada, the return, early ventures, Nehru Place, 2012.",confirm:["The year 2012 and the \"humble, normal family\" wording","Mentioning your father's business slowing down"],
 cap:`That was me in Nehru Place, Diwali 2012. My first time ever in Nehru Place. I had only gone with my cousin to give someone a Diwali gift.

Let me go back a little.

I come from a very humble, normal family in Rohini. After school I started CA and cleared the entrance. Then the family said, Canada chala ja, wahan achhi opportunities hongi. So I went to Humber College for a BBA.

Family was supporting me, so I had a lot of free time. Most of it went in sitting with Indians who had been there 15, 25 years. I would ask everyone, "Kaisa lagta hai yahan?"

Most of them said they wanted to go back to India. And when I asked what's stopping you, the answer was always the same:
"Dil India jaana chahta hai, dimaag nahi jaane deta."

That line sat in my head. I realised I would be stuck in the same circle 20 years later. I had a work permit. If I stayed, I would keep thinking about going back and never go.

So I said, main aaj hi chalta hoon. And I came back.

First business here, tiles and sanitaryware, in partnership. Failed. Then a small factory. Ran it four to six months. Failed. My father's jute bags business was also going down.

So that day in Nehru Place, when the gentleman said, "Hum motherboard import karte hain, kaam karna hai toh le lo," I took one sample home.

Market was closed for Diwali. On the third day I came back and walked the market for two days with that one motherboard. ₹1,000 ka mil raha hai, ₹1,100 mein bik jayega. Lag raha tha chal jayega.

He got me the office next to his on rent. That's how my journey in this industry started.

I don't have a big degree. I went to do a degree and came out with just a diploma. Whatever I know, I learned from the market, from books and business coaches, and from a lot of mistakes.

That's what I want to share here. Not "dekho main kitna bada ban gaya." Just the decisions, the falls, and what I learned from them.

Because I really believe anybody can grow. Just keep learning.`},
{n:2,feel:"I've been there too. If he could restart from zero, so can I.",date:"Tue, 10 Nov · 1:30 pm",hook:"A year and a half of earning. Gone in one night. And my father asked me only one question.",slot:"W1 · Tue",week:1,p:"K",title:"\"Ye samajh tuition fees de di\"",photo:"5504",aud:"Young founders · CXOs · anyone who has failed",
 purpose:"Share the defining early loss, and where your comfort with risk comes from.",
 take:"A loss you can survive becomes the fee for what you learn.",
 hooks:["Pehle saal mein hi ₹50–70 lakh bana liye the. Honestly, I thought, main raja hoon.","A year and a half of earning, gone in one night.","My father asked me only one question that night."],
 src:"Your story from the 26 Oct conversation, and your father's words. The cause of the loss is not mentioned.",confirm:["The ₹50–70 lakh figure","Saying \"overnight, it went to zero\" without giving the reason"],
 cap:`Pehle saal mein hi ₹50–70 lakh bana liye the. That was big money for me. Honestly, I thought, main raja hoon.

Then something happened, and overnight, all of it went to zero.

That night I went to my father. He asked, "Pareshan kyun hai?" I told him everything. A year and a half of earning, gone in one shot.

He asked me only one thing: "Kaam karna aa gaya?"
I said yes.
"Toh phir kaam kar. Kya tension hai. Ye samajh tuition fees de di."

Between 2011 and 2015 I fell many times. That night is the one I remember. It took away my fear of losing. Zero se neeche toh kuch nahi hai.

Even today, that night decides how I take risks.

Before any new business, any new product line, even a big stock purchase, I don't start with how much I can make. Everyone calculates that. I calculate the reverse: what is the maximum I can lose?

On Day 1, I write down three things. How much money. How much time. And the point where I stop. If that number is hit, I wrap it up. Nobody needs to convince me. It was decided before the excitement began.

Because the loss is accepted in advance, it doesn't break me when it comes. I move on, and I'm ready for the next opportunity.

What's the most expensive lesson you have paid for, and what did it teach you?`},
{n:3,feel:"He reads the market clearly, with numbers, not mood.",date:"Wed, 11 Nov · 1:30 pm",hook:"Bahut log bolte hain IT market shrink ho raha hai. I see it the other way.",slot:"W1 · Wed",week:1,p:"I",title:"The IT market is not shrinking",photo:"5562",aud:"Investors · industry peers",
 purpose:"Your first business-perspective post: a clear, contrarian view with a reason behind it.",
 take:"Demand is changing shape, not shrinking.",
 hooks:["Bahut log industry mein bolte hain ki market shrink ho raha hai. I see it the other way.","Only around 10% of Indian homes have a computer. How can this market shrink?"],
 src:"Your view from the 26 Oct conversation. Our team will source-check the 10% / 90% figures before publishing.",confirm:[],
 cap:`Variety bahut aa gayi hai, online badh raha hai, general trade khatam ho raha hai. Yahi sunne ko milta hai.

By the data I follow, only around 10% of Indian homes have a computer. In the US it's around 90%. Many developing countries are at 20, 30, 40%. And India is the largest market in the world by population. How can this market shrink?

Bas tareeka badal raha hai. Pehle ghar mein ek computer tha. Aaj office ke liye laptop chahiye, ghar ka alag, ek phone, ek tab.

Needs badh rahi hain, toh market bhi badhega. We just have to keep up with it.`},
{n:4,feel:"I would actually get to decide things at Geonix.",date:"Thu, 12 Nov · 1:30 pm",hook:"At Geonix, the product manager decides the selling price. Not me.",slot:"W1 · Thu",week:1,p:"L",title:"Room to decide",photo:"5621",aud:"Priority 1: CXOs and senior talent",
 purpose:"Give senior talent a concrete picture of what ownership at Geonix means.",
 take:"Ownership means pricing power, a budget you control, and time to recover from a bad call.",
 hooks:["At Geonix, the product manager decides the selling price. Not me.","Someone on my team is down ₹50 lakh. Here is what we do.","\"Paisa mil raha hai. Par apne hisaab se kaam karne ki freedom nahi hai.\" I hear this from senior people again and again.","Someone in my team loses ₹50 lakh. I don't ask them to recover it in a month."],
 src:"How Geonix works, from the 26 Oct conversation: pricing, the kitty, loss thresholds, the EMI example.",confirm:["Sharing the kitty mechanism and the ₹50 lakh / EMI example publicly"],
 cap:`Any product that comes in, the product manager knows everything. Net cost kya hai, service ki cost kya hai, company ko kitna margin chahiye. Uske baad kitne ka bechna hai, yeh unka decision hai.

Extra mein becha, toh woh paisa ek kitty mein jaata hai. Kahan kharch karna hai, woh bhi wahi decide karte hain.

Loss ho gaya? Koi baat nahi. Thresholds hain. Market upar-neeche hota hai.

Say someone is down ₹50 lakh. Ek mahine mein cover karne ka pressure doge, toh galat decisions honge. So we break it into an EMI. Around ₹4 lakh every month, from the kitty. Baaki, you are still free to take decisions.

A lot of senior people I interview tell me: paisa mil raha hai, but apne hisaab se lead karne ki freedom nahi hai.

At Geonix we tell them: you own the department. Run it whatever way you want. Just get the results.`},

 hooks:["2016 mein meri shaadi hui. The same year was my toughest year in business.","That year, I lost more than I earned."],
 src:"Your 2016 experience from the 26 Oct conversation.",confirm:["Mentioning the marriage year","Exact figures, or simply \"I lost more than I earned\""],
 cap:`In those days, if someone came and said "yeh kaam achha hai, kamai ho jayegi," I would put in some money. My logic was simple. Thoda-thoda paisa multiple jagah lagao, har jagah se kuch aata rahega.

Kahin kuch panga ho gaya, kahin kuch. Three or four places at the same time. Stress badh gaya, and every one of them made a loss. That year, [CONFIRM: "I lost ₹3 crore against ₹1 crore income" or "I lost more than I earned"].

After that I made one rule. Computer hardware, IT, mobility, electronics. Bas. Iske bahar dekhna bhi nahi hai, chahe kitna bhi bada opportunity dikhe.

{n:6,feel:"This brand won't cut corners, even when it's easy money.",date:"Wed, 18 Nov · 1:30 pm",hook:"Imaandari ke ₹50 milne hain. Agar ₹250 aane lage, toh main khud hi bhatak jaunga.",slot:"W2 · Wed",week:2,p:"E",title:"The deal we said no to",photo:"",aud:"Investors · peers · CXOs",
 purpose:"Show integrity as a commercial choice, without identifying anyone.",
 take:"A brand is what customers find out about you over time.",
 hooks:["Imaandari ke ₹50 milne hain. Agar ₹250 aane lage, toh main khud hi bhatak jaunga.","A ₹1,000 product, available at ₹800. \"Kisi ko pata nahi chalega.\""],
 src:"The modified-chip offer from the 26 Oct conversation. Supplier and country are not named. Text-only, with no product image.",confirm:[],
 cap:`That is what went through my mind when we got an offer for motherboards with a modified chip. The BIOS would show a higher spec. The real performance would not match. A ₹1,000 product, available at ₹800. "Kisi ko pata nahi chalega. Ek lakh piece le lo."

{n:7,feel:"There's a real long-term thinking behind Geonix.",date:"Thu, 19 Nov · 1:30 pm",hook:"China mein 20, 30, 50 tier-2 brands easily mil jaayenge. India mein? Haath pe gin loge.",slot:"W2 · Thu",week:2,p:"I",title:"What China showed me about Indian brands",photo:"5662",aud:"Investors · peers",
 purpose:"Explain why Geonix moved from trading to building a brand.",
 take:"India has room for many more strong tier-2 brands.",
 hooks:["2020 tak hum ek trading company the. Margin hai, le aao, bech lo.","China has 50 to 100 tier-2 brands. India has five to seven."],
 src:"Your China observation and the trading-to-brand shift, from the 26 Oct conversation.",confirm:[],
 cap:`2020 tak hum ek trading company the. Margin hai, le aao, bech lo. Margin nahi, band kar do.

Phir laga, aise kab tak chalega?

I used to travel to China a lot. Population almost hamare jitni. Tier-1 brands toh sabko pata hain. But tier 2 mein? 20, 30, 50, 100 brands easily mil jaayenge. Sab survive kar rahe hain, achha paisa bana rahe hain.

Aur India mein? Paanch-saat tier-2 brands.

That gap is where we decided to focus. It takes time.

And I had to unlearn one thing. Coming from a traditional business family, I thought marketing equals sales. ₹50 lakh lagaye, toh ₹5 crore ki sale batao. It took me years to accept that visibility needs its own budget. Sales follow.`},
{n:8,feel:"He changed himself first. That's a leader worth learning from.",date:"Tue, 24 Nov · 1:30 pm",hook:"A few years back, I was not ready to pay ₹16,000 for a Tally licence.",slot:"W3 · Tue",week:3,p:"K",title:"I didn't want to pay ₹16,000 for Tally",photo:"5186",aud:"Founders · CXOs",
 purpose:"Show the learner in you: an honest admission, then how your thinking changed.",
 take:"Change your own thinking first. Then the organisation follows.",
 hooks:["A few years back, I was not ready to pay ₹16,000 for a Tally licence.","Same person. Different thinking."],
 src:"Your 2020 learning experience from the 26 Oct conversation.",confirm:["Naming the 2020 course and trainer, or not","Sharing the software spend figure"],
 cap:`Kyun dena hai? Kaam toh chal hi raha hai.

In 2020 I attended a three-day business course [CONFIRM: name the course and trainer, or not]. It changed my life completely. MIS kya hota hai. HR kyun chahiye. Process aur system kyun chahiye. Team se kaam kaise karwana hai.

I came back and started with a ₹2,000 software subscription. Then I saw kaam badh raha hai. We brought in HR. Started building teams. Dheere-dheere, delegation.

Nuksaan bhi khaya, dhoka bhi khaya. When we brought in senior people, we didn't know how to set the right expectations. We learned that too.

Today we pay [CONFIRM: "₹30–40 lakh" or "many times that"] every year for software across our companies, and I'm happy paying it.

Same person. Different thinking. Learning is a never-ending process.`},
{n:9,feel:"He trusts people on purpose, not blindly.",date:"Wed, 25 Nov · 1:30 pm",hook:"Log mujhse poochte hain: aap itni authority dete ho, log seekh ke chale gaye toh?",slot:"W3 · Wed",week:3,p:"L",title:"Business is a game of probabilities",photo:"5713",aud:"CXOs · founders who struggle to delegate",
 purpose:"Your core view on trusting people, in your own words.",
 take:"Manage the ratio, not every person.",
 hooks:["Log mujhse poochte hain: aap itni authority dete ho, log seekh ke chale gaye toh?","10 log aayenge. Do superstar banenge."],
 src:"Your \"game of probabilities\" view and the employee-loan example, from the 26 Oct conversation.",confirm:["Mentioning employee loans"],
 cap:`I believe business is a game of probabilities. Life bhi.

10 log aayenge. Do superstar banenge, saath bhi rahenge, top-notch kaam bhi karenge. Ek aisa niklega jo literally dhoka dega, nuksaan karayega. Do-teen average. Kuch neutral, chhod ke chale jaayenge bina kuch galat kiye.

Yeh ratio mere dimaag mein hai. Toh woh ek mujhe baaki nau pe trust karne se nahi rok sakta.

Same with employee loans. HR aur CFO kehte hain, sir yeh sahi nahi. I tell them: 10 mein se ek nahi dega, company ko farak nahi padega. Jin nau ka kaam nikal jaayega, unke liye kitni badi baat hai.

Long run mein, jo top ke do hain, woh itna fayda karate hain ki sab cover ho jaata hai.`},
{n:10,feel:"He solves problems without burning relationships.",date:"Thu, 26 Nov · 1:30 pm",hook:"Five months after buying from us, a dealer said our stock was faulty. Then he filed a complaint.",slot:"W3 · Thu",week:3,p:"E",title:"The dealer who filed a complaint",photo:"5351",aud:"Peers · dealers · CXOs",
 purpose:"Credibility through a hard situation handled without burning the relationship.",
 take:"Bigaadne se kuch nahi hone wala. Find a way for both sides to recover.",
 hooks:["Five months after buying from us, a dealer said our stock was faulty. Then he filed a complaint.","\"Bhai, aapka challenge kya hai?\""],
 src:"The RAM dealer situation from the 26 Oct conversation, anonymised as you suggested.",confirm:["Saying \"police complaint\" or just \"complaint\"","The discount amounts","How it ended, and the relationship today"],
 cap:`RAM prices had shot up. He bought a big lot from us, expecting the market to go higher. Everyone was predicting that. The market went flat, then started falling. He held the stock for three or four months and was looking at a big loss.

Then the calls started. Compatibility issue hai. Stock sahi nahi hai. Payment was done long ago. For five months there was no issue, and nobody else in the market had one.

We called him to our office. "Bhai, aapka challenge kya hai?"

He asked for a discount. We met him midway [CONFIRM: amounts]. And to help him recover the rest, we said: chalo, saath mein hard drive ka business shuru karte hain.

Bigaadne se kuch nahi hone wala. Kuch hum lete hain, kuch aap lo. Naye business se aap bhi cover kar loge.

[CONFIRM: how it ended, and where the relationship is today]`},
{n:11,feel:"He's honest about the pressure, and doesn't complain about it.",date:"Tue, 1 Dec · 1:30 pm",hook:"Aaj ke customer ko ₹50 mein bhi ₹100 ka maal chahiye.",slot:"W4 · Tue",week:4,p:"I",title:"\"₹50 mein ₹100 ka maal\"",photo:"5559",aud:"Peers · investors",
 purpose:"How you read today's customer, and how you respond to the pressure.",
 take:"Customer expectations will only rise. Adapting is the only way to survive.",
 hooks:["Aaj ke customer ko ₹50 mein bhi ₹100 ka maal chahiye.","Isi ke saath jeena hai. Aakhri saans tak.","Quality, packaging, delivery, price, service. Today's customer wants all five at once."],
 src:"Your view on customer expectations from the 26 Oct conversation.",confirm:[],
 cap:`Quality, packaging, delivery, price, service. Sab ek saath. 10–15 saal pehle log samajhte the, jitna kharcha utna maal. Aaj nahi.

Zepto, Blinkit ke baad 10 minute mein delivery milti hai. So when the same customer's laptop has a problem, he doesn't even want to go to a service centre. Aur jaaye toh: mujhe abhi doosra chahiye. Dealer ko bhi fast delivery chahiye.

Yeh sab margins pe aata hai. It's a real challenge for our whole industry.

Jab bhi meri team aati hai ki sir, market yeh maang raha hai, I say one thing. Isi ke saath jeena hai. Aakhri saans tak.

That's the only way to survive in this era.`},
{n:12,feel:"He's approachable. I'd like to meet him.",date:"Wed, 2 Dec · 1:30 pm",hook:"People sometimes tell me we have built something big. Mujhe aaj bhi nahi lagta.",slot:"W4 · Wed",week:4,p:"K",title:"Why I'm here",photo:"5242",aud:"All audiences",
 purpose:"Close the month with where you're headed, and an open door to conversations.",
 take:"Gaurav is approachable, and wants to share what he has learned.",
 hooks:["People sometimes tell me we have built something big. Mujhe aaj bhi nahi lagta.","Kuch bada build karna hai."],
 src:"Your thoughts on growth, mentoring and approachability, from the 26 Oct conversation.",confirm:["Why LinkedIn, and why now, in one line in your own words"],
 cap:`Maybe hunger zyada hai. Pehle toh yeh bhi nahi socha tha ki yahan tak pahunchenge.

At this stage, paisa by-product hai. What drives me is simple: kuch bada build karna hai.

[CONFIRM: why LinkedIn, why now, one line in your words]

I don't want to pretend "dekho main kitna bada ban gaya." I want to share what worked, what didn't, and what I learned. Talking to people and helping them grow is something very close to my heart.

And one more thing. People assume that at this scale you become unreachable. Not true. Schedule a time and I'm happy to meet. 15 minute, aadha ghanta, ek takeaway toh mil hi jaayega.

Whether you're a supplier, a young founder, or someone building something in IT, mobility or electronics, let's talk.`}
];

const V2={
1:{hook:`Diwali 2012. Nehru Place. Someone asked me, "Kya karta hai?"`,cap:`Mera jawab tha: "Kuch nahi. Business dhoond raha hoon."

I was there by chance. My cousin had to deliver a Diwali gift, and I went along. It was the first time in my life I had stepped into Nehru Place.

To understand why I had nothing to say, you have to go back a few years.

I come from a very humble, normal family in Rohini. After school I started CA and cleared the entrance. Then the family decided Canada would offer better opportunities, and I went to Humber College for a BBA.

Family was supporting me, so I had time. I spent most of it with Indians who had settled there 15, 25 years ago. In every conversation, I asked the same question: "Kaisa lagta hai yahan?"

Almost everyone said they wanted to return. And almost everyone gave the same reason for not returning:

"Dil India jaana chahta hai, dimaag nahi jaane deta."

I could see myself in that sentence 20 years later. I had a work permit. I knew that if I stayed, I would keep thinking about going back and never go.

So I came back.

The next few years tested me. A tiles and sanitaryware partnership failed. A small factory ran for four to six months and shut down. My father's jute bag business was slowing down too.

That is where I was when the gentleman in Nehru Place said, "Hum motherboard import karte hain. Kaam karna hai toh le lo."

I took one sample home. The market was closed for Diwali. On the third day, I came back and spent two full days walking shop to shop with that one motherboard. Buying at ₹1,000, selling at ₹1,100. Lag raha tha chal jayega.

It did. He rented me the office next to his, and in 2012, my journey in this industry began.

I don't have a big degree. I went for one and came out with a diploma. Everything since has come from the market, from mentors and books, and from mistakes that cost real money.

That is what I will write about here. Not success stories. The decisions behind building Geonix, the ones that worked and the ones that didn't.

Because if there is one thing I believe completely, it is this: anybody can grow. Just keep learning.`},
2:{hook:`A year and a half of earning. Gone in one night. And my father asked me only one question.`,cap:`It was my first real business. Motherboards, Nehru Place, 2012.

I told him everything. A year and a half of work, gone in one shot.

"Kaam karna aa gaya?"

I said yes.

"Toh phir kaam kar. Kya tension hai. Ye samajh tuition fees de di. Padhai ke liye bhi toh paise dete hi hain."

That is still how I take decisions. Before anything new, I don't first ask how much I can make. I ask what is the maximum I can lose. If I can live with that number, I start. And if it happens, I move on.

My father made sure I never got stuck. That was the most valuable fee I ever paid.`},
3:{hook:`"Market shrink ho raha hai." I hear this often in our industry. I see it the other way.`,cap:`The argument usually goes like this. Too much variety. Online is eating into general trade. The IT business has peaked.

Now look at the numbers.

By the data I follow, only around 10% of Indian homes have a computer. In the US, it is around 90%. Many developing countries sit between 20 and 40%.

4:{hook:`At Geonix, the product manager decides the selling price. Not me.`,cap:`Every product that comes into Geonix has a product manager. That person knows everything about it. What it costs us. What service will cost. How much margin the company needs.

After that, they decide the selling price.

If they sell for more, the extra money goes into a separate fund. We call it the kitty. They decide how to use it.

If they lose money, that's okay too, within a limit. Prices go up and down. Losses happen.

Say someone loses ₹50 lakh. I don't ask them to recover it in one month. That pressure only leads to wrong decisions. So we spread it over a year, like an EMI. Around ₹4 lakh a month, from the kitty. And they keep making decisions all through.

Why do we work like this?

6:{hook:`₹1,000 ka motherboard. ₹800 mein mil raha tha. Aur market mein kisi ko pata bhi nahi chalta.`,cap:`The offer was simple. A motherboard with a modified chip. The BIOS would show a higher specification than the board really had. In real use, the performance would never match what the screen said.

7:{hook:`China mein 20, 30, 50 tier-2 brands easily mil jaayenge. India mein? Haath pe gin loge.`,cap:`Till 2020, Geonix was a trading company. Margin hai, le aao, bech lo. Margin nahi, band kar do. It worked, and it paid the bills.

But one question kept coming back. Aise kab tak chalega?

I travelled to China often. Their population is almost ours. Everyone knows their tier-1 brands. Go one level below, and you find dozens of tier-2 brands, each surviving and making good money.

That gap became our direction.

It is not easy here. Dealers need 30–40 days of credit. Customers expect better service every year. Many brands that started 10–20 years before us stopped at that point and stayed there.

It took me years to unlearn that. Visibility doesn't pay back in a month. It needs its own budget and its own patience. Sales follow.

India doesn't need fewer brands. It needs more Indian brands willing to build for the long term.`},

It wasn't smooth. Nuksaan bhi khaya, dhoka bhi khaya. We hired senior people without knowing how to set the right expectations, and some had to leave. We learned how to keep good juniors from quitting.

Every mistake taught us something we needed.

Today we spend [CONFIRM: "₹30–40 lakh" or "many times that"] a year on software across our companies. And I'm happy to pay it.

Same person. Different thinking.

Learning is a never-ending process. I learned that myself before I started telling my team.`},
9:{hook:`"Aap itni authority dete ho. Log seekh ke chale gaye toh?" I get asked this a lot.`,cap:`My answer is simple. Business is a game of probabilities. Life bhi.

If I give real authority to 10 people, I know roughly how it plays out.

Two will become superstars. They stay, and they do top-notch work.
Two or three will be average.
A few will be neutral. Some will leave without doing anything wrong.
And one will let me down. Dhoka dega, nuksaan karayega. That person is coming. I know it.

Many founders try to stop that one person by controlling all ten. They end up losing what the top two could have built.

I would rather manage the ratio than micromanage the people.

Same with employee loans. Our HR and CFO sometimes push back. "Sir, yeh sahi nahi." I tell them: 10 mein se ek nahi dega, company ko farak nahi padega. But for the other nine, it might solve something big in their lives.

In the long run, what the top performers build covers everything else.

Trust will cost you sometimes. Control costs you every day.`},
10:{hook:`Five months after buying from us, a dealer said our stock was faulty. Then he filed a complaint against us.`,cap:`RAM prices had shot up. Everyone in the market expected them to go higher, and this dealer bought a big lot from us.

The market didn't go up. It went flat, then started falling. He held the stock for three or four months, and the loss kept growing.

Then the calls started. Compatibility issue hai. Stock sahi nahi hai. He was shouting at our salesman.

Payment had been settled long ago. For five months, there was no complaint. Nobody else in the market had reported a single issue with that stock. And then came a [CONFIRM: police] complaint.

The easy reaction would have been to fight it.

We called him to our office instead. "Bhai, aapka challenge kya hai?"

He said we had pushed extra stock on him and asked for a discount. We met him midway [CONFIRM: amounts].

Then we went one step further. To help him recover the rest, we offered something new: chalo, saath mein hard drive ka business shuru karte hain.

Bigaadne se kuch nahi hone wala. Kuch hum lete hain, kuch aap lo. Naye business se aap bhi cover kar loge.

[CONFIRM: how it ended, and where the relationship is today]

In our industry, many people assume every supplier and every customer is out to cheat them. Some will. But you don't win by fighting every battle. You win by finding a way for both sides to keep doing business tomorrow.`},
11:{hook:`Groceries arrive in 10 minutes. Now customers expect the same speed when their laptop breaks.`,cap:`Zepto aur Blinkit ne sirf delivery nahi badli. Expectations badal di hain.

Today, when a customer's laptop stops working, he doesn't want to go to a service centre. And if he has to go, his first line is: "Mujhe abhi doosra chahiye."

Dealers want the same. Fast delivery, every single time.

10–15 saal pehle hisaab seedha tha. Jitna kharcha, utna maal.

Aaj ke customer ko ₹50 mein bhi ₹100 ka maal chahiye.

Quality bhi. Packaging bhi. Fast delivery bhi. Sahi price bhi. Aur service turant.

Sab ek saath.

And who pays for all of it? The margin. Every brand in our industry feels this today.

So whenever my team comes to me and says, "Sir, market ab yeh maang raha hai," my answer is always the same:

"Isi ke saath jeena hai."

Expectations will not come down. The customer is not going back to waiting. So we don't wait for the market to slow down. We keep finding ways to keep up with it.

Aakhri saans tak. That is the job now.

To everyone in IT, mobility and electronics: which customer expectation has changed the most in your business?`},
12:{hook:`People sometimes tell me we have built something big. Mujhe lagta hai, abhi toh shuruaat hai.`,cap:`Maybe hunger zyada hai. When I started, I hadn't even imagined reaching where we are today. And I'm more excited about what's ahead than what's behind.

At this stage, money is a by-product. I don't live a lavish life, and I have never felt the need to show anything on social media. What drives me is simpler: kuch bada build karna hai.

[CONFIRM: why LinkedIn, why now, one line in your words]

I don't want to use this space to say "dekho main kitna bada ban gaya." I want to share what worked, what didn't, and what it cost to learn.

Talking to people and helping them grow is something very close to my heart. My team, my family, founders in our industry, big or small.

People also assume that at this scale, you become unreachable. That is not true. Not anytime on the phone, but schedule a time and I am happy to meet. 15 minute, aadha ghanta. Ek takeaway toh mil hi jaayega.

If you are a supplier, a young founder, a senior leader, or someone building something in IT, mobility or electronics, let's talk.

That's why I'm here.`}
};

const stage=$("#stage");
function render(anim){
 const S=SLIDES[cur];
 stage.innerHTML=`<section class="slide ${S.tone}${anim?" enter":""}" aria-label="${esc(S.name)}">${S.r()}</section>`;
 $("#crumb").textContent=(cur+1)+". "+S.name;
 $("#count").textContent=(cur+1)+" / "+SLIDES.length;
 $("#progress").innerHTML=SLIDES.map((s,i)=>`<button class="${i<cur?"done":""}${i===cur?" on":""}" data-go="${i}" type="button" aria-label="Go to ${esc(s.name)}" title="${i+1}. ${esc(s.name)}"></button>`).join("");
 $("#prev").disabled=cur===0;$("#next").disabled=cur===SLIDES.length-1;
 const ta=$("#pcomment");if(ta)ta.addEventListener("input",()=>{state.posts[curPost].comment=ta.value;save();$("#savedNote").textContent="Saved on this device";});
 const mn=$("#notes");if(mn)mn.addEventListener("input",()=>{state.notes=mn.value;save();});
 updateTimer();
}
function go(i,anim=true){if(i<0||i>=SLIDES.length)return;cur=i;if(timerStart===null&&!timerRunning&&timerAcc===0&&i>0)startTimer();render(anim);stage.querySelector(".slide").scrollTop=0;}
function rerender(){const sc=stage.querySelector(".slide");const top=sc?sc.scrollTop:0;render(false);const n=stage.querySelector(".slide");if(n)n.scrollTop=top;}
function startTimer(){timerStart=Date.now();timerRunning=true;}
function elapsed(){return timerAcc+(timerRunning?Date.now()-timerStart:0);}
function fmt(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function updateTimer(){const seg=SEGMENTS[SLIDE_SEG[cur]],el=elapsed(),t=$("#timer");
 if(timerStart===null&&timerAcc===0){t.className="timer";t.innerHTML=`<span class="lbl">${esc(seg.name)} · by ${seg.end}:00</span><button type="button" data-act="timer">Start timer</button>`;return;}
 t.className="timer"+(el/60000>seg.end?" late":"");t.innerHTML=`<span class="lbl">${esc(seg.name)} · by ${seg.end}:00</span><b>${fmt(el)}</b><button type="button" data-act="timer">${timerRunning?"Pause":"Resume"}</button>`;}
setInterval(()=>{if(timerRunning)updateTimer();},1000);

function summaryText(final){const d=new Date().toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"}),c=countStatus();
 let t=`GAURAV JAIN × THE BRANDOLOGIST CO.\nMonth 1 ${final?"Meeting Summary":"Post Approvals"}\nExported: ${d}\n\n`;
 if(final){t+="APPROVALS\n";CATS.forEach((x,i)=>{t+=`${i+1}. ${x.t}: ${STATUS_LABEL[state.cats[x.id]]}\n`;});t+=`\nLinkedIn headline chosen:\n${PROFILE.heads[state.headline].v}\n\n`;}
 t+=`POSTS: ${c.approved} approved · ${c.revision} needs revision · ${c.hold} hold · ${c.pending} pending\n\n`;

 return t;}

function copyText(txt,label){const fb=()=>{openOverlay(`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div style="display:flex;justify-content:space-between;gap:12px"><h3>${esc(label)}</h3><button class="closex" data-act="close" type="button" aria-label="Close">${ico.x}</button></div><label for="sumText" class="sr">Text</label><textarea id="sumText" readonly>${esc(txt)}</textarea><div class="ctrl-row"><button class="btn btn-sm btn-ink" data-act="copy" type="button">Copy</button></div></div>`);};

function allPostsText(){let t=`GAURAV JAIN · LinkedIn · Month 1 · Final posts\nAccount: Gaurav Jain, Founder, Geonix\nPublishing only after Gaurav's approval of each post.\n\n`;
 POSTS.forEach(p=>{const s=state.posts[p.n];t+="=".repeat(48)+"\n"+briefText(p)+`\n\nApproval status: ${STATUS_LABEL[s.status]}${s.comment.trim()?"\nGaurav's comments: "+s.comment.trim():""}\n\n`;});return t;}
function blobSave(name,txt){try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain"}));a.download=name;document.body.appendChild(a);a.click();a.remove();return true;}catch(e){return false;}}
async function exportText(txt,name,label){let saved=false;
 try{const dl=window.claude?await window.claude.use("downloads"):null;if(dl){await dl.save({filename:name,data:txt});saved=true;toast(label+" saved");}}catch(e){}

 if(!saved)copyText(txt,label);}

 openOverlay(`<div class="modal" role="dialog" aria-modal="true" aria-label="Summary"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><div class="eyebrow" style="color:var(--gold-d)">${final?"Meeting summary":"Post approvals"}</div><h3 style="margin-top:8px">${esc(name)}</h3><p class="muted" style="font-size:13.5px;margin-top:6px">Copy the text below and paste it into WhatsApp or email.</p></div><button class="closex" data-act="close" type="button" aria-label="Close">${ico.x}</button></div>

document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.go!==undefined)return go(+d.go);
 if(d.trait!==undefined){curTrait=+d.trait;return rerender();}
 if(d.aud!==undefined){curAud=+d.aud;return rerender();}
 if(d.pillar){curPillar=d.pillar;return rerender();}
 if(d.open){curPost=+d.open;return go(10);}
 if(d.post){curPost=+d.post;return rerender();}
 if(d.pst){state.posts[curPost].status=d.pst;save();rerender();return toast("Post "+nn(curPost)+": "+STATUS_LABEL[d.pst]);}
 if(d.cat){state.cats[d.cat]=d.st;save();return rerender();}
 if(d.head!==undefined){state.headline=+d.head;save();closeOverlay();rerender();return toast("Headline updated on the profile");}
 switch(d.act){
  case "begin":return go(1);
  case "studio":return go(10);
  case "about":aboutOpen=!aboutOpen;return rerender();
  case "heads":return openHeads();
  case "approveProfile":state.cats.profile=state.cats.profile==="approved"?"pending":"approved";save();rerender();return toast(state.cats.profile==="approved"?"Profile direction approved":"Profile set back to pending");
  case "expand":{const pb=$("#postBody");pb.classList.toggle("clamp");b.textContent=pb.classList.contains("clamp")?"…see more":"Show less";return;}
  case "read":return openReader();
  case "readPrev":curPost=Math.max(1,curPost-1);rerender();return openReader();
  case "readNext":curPost=Math.min(12,curPost+1);rerender();return openReader();
  case "prevPost":curPost=Math.max(1,curPost-1);return rerender();
  case "nextPost":curPost=Math.min(12,curPost+1);return rerender();
  case "calendar":return go(8);
  case "copyBrief":return copyText(briefText(POSTS.find(x=>x.n===curPost)),"Post brief");
  case "exportAll":return exportText(allPostsText(),"Gaurav-Jain-Month1-Final-Posts.txt","All final posts");

  case "close":return closeOverlay();
  case "copy":{const ta=$("#sumText");const fb=()=>{ta.focus();ta.select();toast("Text selected. Press Ctrl/Cmd + C");};try{navigator.clipboard.writeText(ta.value).then(()=>toast("Summary copied"),fb);}catch(err){fb();}return;}
  case "timer":if(timerStart===null&&timerAcc===0)startTimer();else if(timerRunning){timerAcc+=Date.now()-timerStart;timerRunning=false;}else{timerStart=Date.now();timerRunning=true;}return updateTimer();

function toggleFS(){try{if(document.fullscreenElement)document.exitFullscreen();else{const r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(()=>toast("Fullscreen isn't available in this view"));}}catch(e){toast("Fullscreen isn't available in this view");}}
document.addEventListener("keydown",e=>{
 if(!ov.hidden){if(e.key==="Escape")closeOverlay();return;}
 const tag=(e.target.tagName||"").toLowerCase();if(tag==="textarea"||tag==="input")return;
 if(["ArrowRight","PageDown"].includes(e.key)||(e.key===" "&&tag!=="button")){e.preventDefault();go(cur+1);}
 else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(cur-1);}
 else if(e.key==="Home")go(0);else if(e.key==="End")go(SLIDES.length-1);
 else if(e.key==="f"||e.key==="F")toggleFS();
 else if(cur===10&&(e.key==="ArrowDown"||e.key==="j")){e.preventDefault();curPost=Math.min(12,curPost+1);rerender();}
 else if(cur===10&&(e.key==="ArrowUp"||e.key==="k")){e.preventDefault();curPost=Math.max(1,curPost-1);rerender();}
